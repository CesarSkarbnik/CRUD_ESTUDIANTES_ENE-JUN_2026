version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: cesar
      POSTGRES_PASSWORD: tu_password_seguro
      POSTGRES_DB: db_jenkins
    networks:
      - jenkins_cesar
    volumes:
      - db_data:/var/lib/postgresql/data
    deploy:
      placement:
        constraints:
          # Restricción para que solo corra en el nodo Worker-1
          - node.hostname == Worker-1
      restart_policy:
        condition: on-failure

  web:
    image: cesartellez301/jenkins:latest
    ports:
      - "8081:5000"
    environment:
      # Conexión usando el nombre del servicio 'db'
      DATABASE_URL: postgresql://cesar:tu_password_seguro@db:5432/db_jenkins
    networks:
      - jenkins_cesar
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure

networks:
  jenkins_cesar:
    external: true  # <--- ¡ESTE ES EL CAMBIO CLAVE! Le dice a Swarm que use la red que ya creó el script

volumes:
  db_data: